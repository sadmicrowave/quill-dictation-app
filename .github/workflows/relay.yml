# Deploys the support / update relay (relay/) to Cloudflare, but only when something in relay/ changed on main.
# A new build of the app never needs this: the app only knows the relay's address.
#
# One-time setup (Settings > Secrets and variables > Actions of this repository):
#   CLOUDFLARE_API_TOKEN   an API token with "Edit Cloudflare Workers" permission (My Profile > API Tokens > Create Token)
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers overview page
# The relay's own secret (GITHUB_TOKEN, set with `wrangler secret put`) stays in Cloudflare and is not touched by a deploy.
name: relay

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test the relay
        run: node --test relay/worker.test.mjs
      - name: Deploy
        working-directory: relay
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
