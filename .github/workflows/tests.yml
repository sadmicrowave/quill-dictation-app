name: tests

# Quick tests on every push and pull request; the full suite once a week and on demand
# (Actions tab > tests > Run workflow). Quill's tests run on Qt's "offscreen" platform: no screen is needed.
on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full suite (slow tests too)"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC: the full suite

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Windows is allowed to fail until the windows branch has been merged and its first green run is seen.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      QUILL_NO_SOUND: "1"          # no audio device on a runner
      QUILL_NO_HOSTS: "1"          # no spreadsheet programs on a runner: nothing is asked of them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Quick tests
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full)
        run: python -m pytest -q
      - name: Full tests
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: python -m pytest -q --full
