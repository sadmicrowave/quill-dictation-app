name: tests

# Quick tests on every push and pull request; the full suite once a week and on demand
# (Actions tab > tests > Run workflow). Quill's tests run on Qt's "offscreen" platform: no screen is needed.
on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full suite (slow tests too)"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC: the full suite

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Windows may fail on any branch except `windows` (main has no Windows provider until that branch is merged), and the
    # experimental systems may fail anywhere: they are there to be looked at, not to block.
    continue-on-error: ${{ matrix.experimental == true || (startsWith(matrix.os, 'windows') && github.ref_name != 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 (latest) and 15 on Apple Silicon, macOS 15 on Intel; Windows Server 2025 and 2022 (x64). GitHub offers no
        # Windows 10 image and no 32-bit one (and Qt for Python has no 32-bit wheels), so those cannot be tested here.
        os: [macos-26, macos-15, macos-15-intel, windows-2025, windows-2022]
        include:
          - os: windows-11-arm                   # Windows 11 on Arm: its wheels (Qt, Vosk) may not all exist yet
            experimental: true
    env:
      QT_QPA_PLATFORM: offscreen
      QUILL_NO_SOUND: "1"          # no audio device on a runner
      QUILL_NO_HOSTS: "1"          # no spreadsheet programs on a runner: nothing is asked of them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Each step keeps its output and, if it fails, shows the end of it as an annotation (readable without signing in).
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          (pip install -r requirements.txt pytest) 2>&1 | tee install.log
          test "${PIPESTATUS[0]}" -eq 0 || { python tools/ci_annotate.py "install failed" install.log 80; exit 1; }
      - name: Quick tests
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full)
        shell: bash
        run: |
          python -m pytest -q --tb=line -rf 2>&1 | tee tests.log
          test "${PIPESTATUS[0]}" -eq 0 || { python tools/ci_annotate.py "tests failed" tests.log 120; exit 1; }
      - name: Full tests
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        shell: bash
        run: |
          python -m pytest -q --full --tb=line -rf 2>&1 | tee tests.log
          test "${PIPESTATUS[0]}" -eq 0 || { python tools/ci_annotate.py "tests failed" tests.log 120; exit 1; }
