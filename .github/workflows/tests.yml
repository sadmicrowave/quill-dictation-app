name: tests

# Two lanes, and nothing on a plain push to a feature branch (the work is checked locally first, and again once on its pull request).
#
#   pull request into develop   the quick tests on macOS 26 and Windows 2025 (one of them when only that system's own files changed: tools/ci_plan.py);
#                               a draft pull request is skipped until it is marked ready
#   pull request into main, a push to main, the weekly run, a manual run   every runner (macOS 26, 15, 15 Intel, Windows 2025, 2022, 11 Arm)
#   a push to develop (a merge)  nothing here: the pull request already ran these tests on the same code (the "dev build" workflow runs only
#                               when packaging changed)
#
# The full suite (slow tests too) runs once a week and on demand (Actions tab > tests > Run workflow). Quill's tests run on Qt's "offscreen"
# platform: no screen is needed. A newer push to the same pull request cancels the run still going for the old one.
#
# Documentation never starts a run: the README files and the docs folder are read by nothing. Everything else counts, the bundled help pages
# (quill/help) and UI_STYLE.md included, because tests read them. (A new documentation file that no test reads goes in
# the list below; a file a test starts reading comes off it.)
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!README.md"
      - "!**/README.md"
      - "!docs/**"
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!README.md"
      - "!**/README.md"
      - "!docs/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full suite (slow tests too)"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC: the full suite

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: which runners
    runs-on: ubuntu-latest
    # A draft pull request is not checked until it is marked ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # the pull request's changed files are listed against its base branch
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # macOS 26 (latest) and 15 on Apple Silicon, macOS 15 on Intel; Windows Server 2025 and 2022 (x64). GitHub offers no
          # Windows 10 image and no 32-bit one (and Qt for Python has no 32-bit wheels), so those cannot be tested here.
          # Windows 11 on Arm is experimental: its wheels (Qt, Vosk) may not all exist yet.
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          else
            : > changed.txt
          fi
          python3 tools/ci_plan.py --event "$EVENT" --base "${BASE_REF:-}" --changed changed.txt >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Only the experimental systems may fail: they are there to be looked at, not to block.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      QT_QPA_PLATFORM: offscreen
      QUILL_NO_SOUND: "1"          # no audio device on a runner
      QUILL_NO_HOSTS: "1"          # no spreadsheet programs on a runner: nothing is asked of them
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Each step keeps its output and, if it fails, shows the end of it as an annotation (readable without signing in).
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          (pip install -r requirements.txt pytest) 2>&1 | tee install.log
          test "${PIPESTATUS[0]}" -eq 0 || { python tools/ci_annotate.py "install failed" install.log 80; exit 1; }
      - name: Support relay tests
        if: matrix.os == 'macos-26'
        run: node --test relay/worker.test.mjs
      - name: Qt environment
        shell: bash
        run: python tools/qt_environment.py
      - name: Quick tests
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full)
        shell: bash
        run: |
          python -m pytest -q --tb=line -rf 2>&1 | tee tests.log
          test "${PIPESTATUS[0]}" -eq 0 || { python tools/ci_annotate.py "tests failed" tests.log 120; exit 1; }
      - name: Full tests
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        shell: bash
        run: |
          python -m pytest -q --full --tb=line -rf 2>&1 | tee tests.log
          test "${PIPESTATUS[0]}" -eq 0 || { python tools/ci_annotate.py "tests failed" tests.log 120; exit 1; }
